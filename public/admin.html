<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC Fitting Sim — 관리</title>
<style>
:root{--bg:#0b0f14;--panel:#131a23;--line:#233041;--txt:#d7e1ec;--dim:#8aa0b4;--acc:#4cc2ff;--warn:#ffb454;--bad:#ff6b6b;--ok:#51d88a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,"Noto Sans KR",sans-serif;font-size:14px}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header small{color:var(--dim)}
header .home{color:var(--acc);text-decoration:none;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{font-size:13px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
select,input{width:100%;background:#0e141c;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px}
button{white-space:nowrap;background:#12314a;color:var(--acc);border:1px solid #1e4a6e;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px}
button:hover{background:#17405f}button:disabled{opacity:.5;cursor:default}
button.danger{color:var(--bad);border-color:#6e2b2b;background:#33121a}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--dim);font-weight:400}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .fix{flex:0 0 auto}
.dim{color:var(--dim);font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.tag{display:inline-block;white-space:nowrap;background:#0e141c;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--dim);margin:1px 2px}
.tag.gr{color:var(--ok);border-color:#1e6e42}.tag.dc{color:var(--acc);border-color:#1e4a6e}
.auth-area{margin-left:auto;display:flex;gap:8px;align-items:center}
.auth-chip{font-size:12px;color:var(--txt);background:#0e141c;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
#guard{padding:40px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header>
<h1>🚀 SC Fitting Sim</h1><small>관리 화면</small>
<a class="home" href="index.html">← 시뮬레이터로</a>
<div id="authArea" class="auth-area"></div>
</header>
<div id="guard">권한 확인 중…</div>
<main id="adminMain" style="display:none">
  <div class="panel">
    <h2>Discord 역할 연결 — 서버 역할 → 사이트 그룹</h2>
    <div class="dim" style="margin-bottom:8px">로그인한 회원이 연결된 Discord 역할을 가지고 있으면 해당 그룹에 자동 배정됩니다. 역할이 회수되면 다음 확인 때 그룹에서 빠집니다.</div>
    <div id="mappingList"><span class="dim">불러오는 중…</span></div>
    <div class="row" style="margin-top:10px">
      <select id="mapRole"></select>
      <select id="mapGroup"></select>
      <button id="mapAdd" class="fix">연결 추가</button>
    </div>
    <div id="mapMsg" class="dim" style="margin-top:6px"></div>
  </div>
  <div class="panel">
    <h2>그룹</h2>
    <div id="groupList"><span class="dim">불러오는 중…</span></div>
    <div class="row" style="margin-top:10px">
      <input id="newGroupName" placeholder="새 그룹 이름">
      <button id="groupAdd" class="fix">만들기</button>
    </div>
  </div>
  <div class="panel">
    <h2>회원</h2>
    <div class="row" style="margin-bottom:8px"><input id="memberSearch" placeholder="이름 또는 Discord ID 검색"></div>
    <div id="memberList"><span class="dim">불러오는 중…</span></div>
  </div>
  <div class="panel">
    <h2>관리 기록</h2>
    <div id="auditList"><span class="dim">불러오는 중…</span></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
